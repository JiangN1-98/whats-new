name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: whats_new
          POSTGRES_PASSWORD: whats_new_dev
          POSTGRES_DB: whats_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whats_new -d whats_new_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.6-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://whats_new:whats_new_dev@localhost:5432/whats_new_test?schema=public
      TEST_DATABASE_URL: postgresql://whats_new:whats_new_dev@localhost:5432/whats_new_test?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_MODE: dev
      AI_MODE: fake
      WORKER_MODE: fixture
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:validate
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:integration
      - run: pnpm db:seed && pnpm db:seed
      - run: pnpm fixture:smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
